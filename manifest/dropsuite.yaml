schema_version: 1.0
source_id: dropsuite_v1
display_name: Dropsuite
category: Licensing
scope_default: Client-level

# ── Credential Schema ────────────────────────────────────────────────────────
# Dropsuite authenticates with two static tokens sent as request headers.
# Both are persisted only in AWS Secrets Manager — never in the DB, logs, or
# frontend state.
credential_schema:
  - key: DROPSUITE_API_URL
    label: API Base URL
    type: url
    required: true
    default: https://dropsuite.us
  - key: DROPSUITE_RESELLER_TOKEN
    label: Reseller Token
    type: secret
    required: true
  - key: DROPSUITE_ACCESS_TOKEN
    label: Access Token
    type: secret
    required: true

# ── Auth Strategy ────────────────────────────────────────────────────────────
# strategy: header_key
#   No token exchange. The two credential tokens are injected as static headers
#   on every data request. The engine resolves them once and reuses them.
auth:
  strategy: header_key
  headers:
    X-Reseller-Token: "{credentials.DROPSUITE_RESELLER_TOKEN}"
    X-Access-Token: "{credentials.DROPSUITE_ACCESS_TOKEN}"
  on_failure: abort

# ── Steps ────────────────────────────────────────────────────────────────────
# Single step. GET /api/users returns a TOP-LEVEL JSON ARRAY of user objects,
# so there is no response.data_key — the array itself is the row set.
# No pagination parameters are documented for this endpoint (type: none).
steps:
  - id: fetch_users
    description: >
      Retrieve all Dropsuite users (backup seats) visible to the reseller +
      access token pair, including seat counts, storage usage, plan, and
      organization metadata.
    method: GET
    url: "{credentials.DROPSUITE_API_URL}/api/users"
    pagination:
      type: none
    on_failure: abort

# ── Schema Fields ─────────────────────────────────────────────────────────────
# Canonical field definitions for downstream Silver normalisation.
# source: JSONPath evaluated against each raw user record from fetch_users.
# NOTE: reseller_token / authentication_token are intentionally NOT mapped —
# they are credential echoes, not business data, and must not flow downstream.
schema_fields:
  - key: user_id
    label: User ID
    source: "$.id"
    step: fetch_users
    required: true
    type: string
  - key: email
    label: Email
    source: "$.email"
    step: fetch_users
    required: true
    type: string
  - key: organization_id
    label: Organization ID
    source: "$.organization_id"
    step: fetch_users
    required: true
    type: integer
