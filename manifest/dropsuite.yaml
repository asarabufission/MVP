# ── Landing ───────────────────────────────────────────────────────────────────
# One raw JSON file:
#   raw/dropsuite_v1/<client_id>/<run_date>/fetch_users.json
landing:
  type: s3
  bucket: "msp-guardian-mvp"
  key_pattern: "raw/{source_id}/{client_id}/{run_date}/{step_id}.json"
  format: json
  file_per: step
  write_mode: overwrite
  include_run_metadata: true
