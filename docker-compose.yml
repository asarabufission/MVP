services:
  postgres:
    image: postgres:16-alpine
    container_name: msp_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - msp_net

  redis:
    image: redis:7-alpine
    container_name: msp_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - msp_net

  backend:
    build: ./backend
    container_name: msp_backend
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - msp_net

  frontend:
    build: ./frontend
    container_name: msp_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - msp_net

networks:
  msp_net:
    driver: bridge

volumes:
  postgres_data:
  localstack_data:
