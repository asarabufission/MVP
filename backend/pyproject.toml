[project]
name = "msp-guardian-backend"
version = "0.1.0"
description = "MSP Guardian POC backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "redis[hiredis]>=5.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "genson>=1.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.pyright]
include = ["app", "lambdas"]
exclude = ["**/__pycache__", "alembic/versions", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
pythonVersion = "3.14"
